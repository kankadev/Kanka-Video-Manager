name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      
    - name: Create native installer with jpackage
      run: |
        jpackage `
          --input target `
          --name "KankaVideoManager" `
          --main-class dev.kanka.kankavideomanager.App `
          --main-jar kanka-video-manager-1.0-SNAPSHOT-all.jar `
          --type msi `
          --app-version 1.0.0 `
          --vendor "Kanka" `
          --description "Video manager for sorting surveillance videos" `
          --win-console `
          --win-menu `
          --win-shortcut
      shell: pwsh
      
    - name: Get version from tag
      id: get_version
      run: |
        if ("${{ github.ref }}" -like "refs/tags/*") {
          $version = "${{ github.ref }}" -replace "refs/tags/", ""
          echo "version=$version" >> $env:GITHUB_OUTPUT
        } else {
          $version = "1.0-SNAPSHOT"
          echo "version=$version" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh
      
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/kanka-video-manager-${{ steps.get_version.outputs.version }}-all.jar
          *.msi
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
